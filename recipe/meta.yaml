{% set name = "conch-sounds" %}
{% set version = "0.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name.replace('-', '_') }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e38f2c8de77aceea5ba94fde0f53427c4d822341f829ed11e28bb63f1c1ac5ba

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - numpy
    - librosa
    - pysoundfile
    - pyraat
    - praatio
    - pyraat
    - scipy

test:
  imports:
    - conch
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/mmcauliffe/Conch-sounds
  summary: Analyze acoustic similarity in Python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://conch-sounds.readthedocs.io/en/latest/
  dev_url: https://github.com/mmcauliffe/Conch-sounds

extra:
  recipe-maintainers:
    - lxy2304
    - mmcauliffe
